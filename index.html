<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Filipo Café Resto Bar | Menú y Carta Digital Salta</title>
    
    <!-- SEO & Indexing -->
    <meta
      name="description"
      content="Carta digital oficial de Filipo Café Resto Bar en Salta. Tablas abundantes para compartir, cafetería de especialidad, menú ejecutivo, hamburguesas caseras, minutas y coctelería. Carta abierta todo el día."

    <meta name="author" content="Filipo Café Resto Bar" />
    <link rel="canonical" href="https://filipocafe.com.ar" />

    <!-- Mobile & PWA Theme -->
    <meta name="theme-color" content="#1A1510" />
    <meta name="referrer" content="no-referrer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Filipo Menú" />

    <!-- Open Graph (Facebook / WhatsApp / iMessage) -->
    <meta property="og:type" content="restaurant.menu" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Filipo Café Resto Bar" />
    <meta property="og:title" content="Filipo Café Resto Bar | Menú y Carta Digital Salta" />

      content="Carta digital oficial con precios actualizados. Tablas para compartir, cafetería, menú ejecutivo y coctelería en Salta. Carta abierta todo el día."

    <meta property="og:image" content="./platos/tablas.jpg" />
    <meta property="og:url" content="https://filipocafe.com.ar" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Filipo Café Resto Bar | Menú y Carta Digital Salta" />
    <meta
      name="twitter:description"
      content="Carta digital oficial con precios actualizados. Tablas para compartir, cafetería, menú ejecutivo y coctelería en Salta."
    />
    <meta name="twitter:image" content="./platos/tablas.jpg" />

    <meta name="geo.region" content="AR-A" />
    <meta name="geo.placename" content="Salta, Argentina" />
    <meta name="geo.position" content="-24.7859;-65.4117" />
    <meta name="ICBM" content="-24.7859, -65.4117" />

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    />

    <script type="application/ld+json">

        "name": "Filipo Café Resto Bar",

          "addressLocality": "Salta",
          "addressRegion": "Salta",
          "addressCountry": "AR"
        },
        "telephone": "+5493874540704",
        "servesCuisine": ["Argentine", "Café", "Bar", "Picadas"],

  <body class="bg-[#1A1510] text-[#FAF3E8] antialiased selection:bg-[#C05028] selection:text-white">
